name: Đi Chợ Chung – Android

on:
  push:
    branches: ["di-cho-gia-dinh/**"]
  workflow_dispatch:

# contents: write chỉ để bước cuối đẩy ảnh chụp lên nhánh ci-snapshots/… (nhánh này không khớp di-cho-gia-dinh/** nên không tự kích lại workflow).
permissions:
  contents: write

concurrency:
  group: di-cho-chung-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test + ảnh chụp + APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lấy google-services.json từ secret (nếu có)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Đã có google-services.json"
          else
            echo "Không có secret GOOGLE_SERVICES_JSON – build không kèm cấu hình Firebase"
          fi

      # recordRoborazziDebug chạy toàn bộ unit test (kể cả Robolectric) và ghi lại ảnh chụp.
      - name: Unit test + chụp ảnh giao diện
        run: ./gradlew :app:recordRoborazziDebug --stacktrace

      - name: Build APK debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Ảnh chụp giao diện
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: android/app/src/test/snapshots/
          if-no-files-found: ignore

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: dichochung-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Phiên cloud không tải được artifact (blob storage bị chặn) nhưng git thì được: đẩy ảnh chụp lên nhánh riêng
      # ci-snapshots/<nhánh> (một commit duy nhất, ghi đè mỗi lần) để Claude tự soi ảnh mà chủ dự án không phải tải.
      - name: Đẩy ảnh chụp lên nhánh ci-snapshots
        if: always() && github.event_name == 'push'
        env:
          SRC_SHA: ${{ github.sha }}
          SRC_REF: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -d app/src/test/snapshots ] || exit 0
          tmp=$(mktemp -d)
          cp -r app/src/test/snapshots/. "$tmp/"
          cd "$tmp"
          git init -q -b snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshots for $SRC_REF @ $SRC_SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "snapshots:refs/heads/ci-snapshots/$SRC_REF"
