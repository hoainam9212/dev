name: Đi Chợ Chung – Cloud Functions

on:
  push:
    branches: ["di-cho-gia-dinh/**"]
    paths: ["functions/**", ".github/workflows/functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    name: Test + build functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
